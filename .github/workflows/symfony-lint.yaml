name: Symfony Lint

on:
    schedule:
        - cron: '30 0 * * *'
    push:
        branches:
            - 6.x
            - 5.x
    pull_request:

permissions:
    contents: read

jobs:
    container:

        # idct/adminata is installed from a VCS repository, which Composer resolves through the
        # GitHub API. Unauthenticated calls share a per-runner hourly budget, and the failure is an
        # install that stops with "Could not authenticate against github.com". The built-in token
        # lifts the limit and needs no secret.
        env:
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        name: Symfony container

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2
                  extensions: mongodb

            - name: Install Composer dependencies (highest)
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: highest

            - name: Lint container
              run: make lint-symfony-container

    twig:

