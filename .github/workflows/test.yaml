name: Test

on:
    schedule:
        - cron: '30 0 * * *'
    push:
        branches:
            - 6.x
            - 5.x
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: PHP ${{ matrix.php-version }} + ${{ matrix.dependencies }} + ${{ matrix.variant }}

        runs-on: ubuntu-latest

        continue-on-error: ${{ matrix.allowed-to-fail }}

        env:
            # idct/adminata is installed from a VCS repository, which Composer resolves through the
            # GitHub API. Unauthenticated calls share a per-runner hourly budget, and the failure is an
            # install that stops with "Could not authenticate against github.com". The built-in token
            # lifts the limit and needs no secret.
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
            SYMFONY_REQUIRE: ${{ matrix.symfony-require }}

        # We deliberately do NOT run Selenium as a service here:
        # service containers can't reach the runner's loopback where Panther
        # starts its built-in PHP web server (Firefox-in-container looking up
        # 127.0.0.1:9080 looks inside itself, not at the host).
        # Instead we use the Firefox + geckodriver preinstalled on
        # ubuntu-latest — Panther's FirefoxManager finds both on PATH and
        # drives Firefox locally, where 127.0.0.1:9080 resolves correctly.
        # PANTHER_SELENIUM_HOST is therefore left unset in CI; the local
        # docker-compose dev path (where the host has no usable Firefox)
        # still uses the Selenium grid.
        services:
            mongo:
                image: mongo:latest
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q ^1$"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - '8.4'
                    - '8.5'
                dependencies: [highest]
                allowed-to-fail: [false]
                symfony-require: ['']
                variant: [normal]
                include:
                    # Pin Symfony 7.4 (latest LTS-ish) and 8.0 to make sure both
                    # supported lines stay green; the PHP 8.4 + lowest row was
                    # dropped together with Symfony 7.3 / persistence 3 support.
                    - php-version: '8.5'
                      dependencies: highest
                      allowed-to-fail: false
                      symfony-require: 7.4.*
                      variant: symfony/symfony:"7.4.*"
                    - php-version: '8.5'
                      dependencies: highest
                      allowed-to-fail: false
                      symfony-require: 8.0.*
                      variant: symfony/symfony:"8.0.*"

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: pcov
                  tools: composer:v2, flex
                  extensions: mongodb

            - name: Add PHPUnit matcher
              run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Install variant
              if: matrix.variant != 'normal' && !startsWith(matrix.variant, 'symfony/symfony')
              run: composer require ${{ matrix.variant }} --no-update

            - name: Install Composer dependencies (${{ matrix.dependencies }})
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: ${{ matrix.dependencies }}

            - name: Run Tests with coverage
              run: make coverage

            - name: Upload coverage to Codecov
              # Always run — we want coverage uploaded even when a few tests
              # fail so the report on Codecov stays current and we can compare
              # what regressed. Skip only when there's literally no file to
              # upload (e.g. setup-php / composer install bailed earlier).
              if: ${{ !cancelled() && hashFiles('build/logs/clover.xml') != '' }}
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: ideaconnect/adminata-admin-mongodb-bundle
                  files: ./build/logs/clover.xml
                  flags: php-${{ matrix.php-version }}-${{ matrix.dependencies }}${{ matrix.symfony-require && format('-symfony-{0}', matrix.symfony-require) || '' }}
                  name: php-${{ matrix.php-version }} ${{ matrix.dependencies }}${{ matrix.symfony-require && format(' (symfony {0})', matrix.symfony-require) || '' }}
                  fail_ci_if_error: false
                  verbose: true
