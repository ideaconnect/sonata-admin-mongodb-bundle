name: Test

on:
    schedule:
        - cron: '30 0 * * *'
    push:
        branches:
            - 5.x
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: PHP ${{ matrix.php-version }} + ${{ matrix.dependencies }} + ${{ matrix.variant }}

        runs-on: ubuntu-latest

        continue-on-error: ${{ matrix.allowed-to-fail }}

        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony-require }}
            PANTHER_SELENIUM_HOST: http://127.0.0.1:4444/wd/hub

        services:
            mongo:
                image: mongo:latest
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q ^1$"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

            selenium:
                image: selenium/standalone-firefox:latest
                ports:
                    - 4444:4444
                options: >-
                    --shm-size=2g
                    --health-cmd "curl -fsS http://localhost:4444/status | grep -q '\"ready\": true'"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - '8.4'
                    - '8.5'
                dependencies: [highest]
                allowed-to-fail: [false]
                symfony-require: ['']
                variant: [normal]
                include:
                    - php-version: '8.4'
                      dependencies: lowest
                      allowed-to-fail: false
                      variant: normal
                    - php-version: '8.5'
                      dependencies: highest
                      allowed-to-fail: false
                      symfony-require: 7.3.*
                      variant: symfony/symfony:"7.3.*"
                    - php-version: '8.5'
                      dependencies: highest
                      allowed-to-fail: false
                      symfony-require: 7.4.*
                      variant: symfony/symfony:"7.4.*"
                    - php-version: '8.5'
                      dependencies: highest
                      allowed-to-fail: false
                      symfony-require: 8.0.*
                      variant: symfony/symfony:"8.0.*"

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  coverage: pcov
                  tools: composer:v2, flex
                  extensions: mongodb

            - name: Add PHPUnit matcher
              run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Install variant
              if: matrix.variant != 'normal' && !startsWith(matrix.variant, 'symfony/symfony')
              run: composer require ${{ matrix.variant }} --no-update

            - name: Install Composer dependencies (${{ matrix.dependencies }})
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies }}

            - name: Run Tests with coverage
              run: make coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./build/logs/clover.xml
                  flags: php-${{ matrix.php-version }}-${{ matrix.dependencies }}${{ matrix.symfony-require && format('-symfony-{0}', matrix.symfony-require) || '' }}
                  fail_ci_if_error: false
                  verbose: true
