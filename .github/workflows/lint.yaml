name: Lint

on:
    schedule:
        - cron: '30 0 * * *'
    push:
        branches:
            - 6.x
            - 5.x
    pull_request:

permissions:
    contents: read

jobs:
    php-cs-fixer:

        # idct/adminata is installed from a VCS repository, which Composer resolves through the
        # GitHub API. Unauthenticated calls share a per-runner hourly budget, and the failure is an
        # install that stops with "Could not authenticate against github.com". The built-in token
        # lifts the limit and needs no secret.
        env:
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        name: PHP-CS-Fixer

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2
                  extensions: mongodb

            - name: Install Composer dependencies (highest)
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: highest

            - name: Lint PHP files
              run: make lint-php

    composer:
        name: Composer

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2, composer-normalize:2
              env:
                  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Lint Composer
              run: make lint-composer

    yaml-files:
        name: YAML files

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install yamllint
              run: sudo apt-get update && sudo apt-get install -y yamllint

            - name: Lint files
              run: make lint-yaml

    xml-files:
        name: XML files

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install required dependencies
              run: sudo apt-get update && sudo apt-get install -y libxml2-utils

            - name: Lint xml files
              run: make lint-xml

            - name: Lint xliff files
              run: make lint-xliff
