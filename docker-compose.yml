services:
    mongo:
        image: mongo:latest
        container_name: adminata-mongodb-admin-test
        ports:
            - "27017:27017"
        restart: unless-stopped

    selenium:
        image: selenium/standalone-firefox:latest
        container_name: adminata-mongodb-admin-selenium
        network_mode: host
        shm_size: 2g
        environment:
            SE_NODE_MAX_SESSIONS: "1"
            SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4444/status"]
            interval: 5s
            timeout: 3s
            retries: 20
